<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="A frontend-only Secret Number guessing game with Easy, Medium and Hard difficulties."
    />
    <title>UrLuck</title>
    <link rel="icon" type="image/png" href="/public/Lucky-charm.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("guessnum:theme");
        if (
          t === "dark" ||
          (t !== "light" &&
            !window.matchMedia("(prefers-color-scheme: light)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
